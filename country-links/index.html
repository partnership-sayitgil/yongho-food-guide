<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>국가별 손님 안내 링크 · 사잇길부산</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<style>
:root{--ink:#14322f;--paper:#f6f3ec;--accent:#b4532a;--line:#d8ddd6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Paperlogy,"Malgun Gothic",sans-serif;line-height:1.6}main{max-width:880px;margin:auto;padding:36px 20px 64px}h1{font-size:clamp(26px,5vw,36px);line-height:1.25;margin:0 0 14px}p{margin:8px 0;color:#53645e}.intro{max-width:620px}.output{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:20px;margin:26px 0}label{display:block;font-weight:700;margin-bottom:8px}input,button{font:inherit}input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;color:var(--ink);font-size:15px}input[readonly]{background:#f5f7f4}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:#fff;color:var(--ink);font-weight:600;min-height:48px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.copy{background:var(--ink);color:#fff;border-color:var(--ink);flex:none}.linkrow{display:flex;gap:8px}#feedback{min-height:26px;margin-top:10px;color:var(--accent);font-weight:600}.groups h2{font-size:18px;margin:26px 0 12px}.countries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.country{text-align:left;padding:12px}.country small{display:block;font-weight:400;color:#64736c;font-size:12px}.country[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.country[aria-pressed=true] small{color:#dce6df}.custom{border-top:1px solid var(--line);margin-top:30px;padding-top:24px}.custom h2{font-size:20px;margin:0 0 12px}.custom button{background:var(--accent);color:#fff;border-color:var(--accent)}.help{font-size:14px}a{color:var(--ink)}@media(max-width:580px){main{padding:24px 16px 48px}.countries{grid-template-columns:repeat(2,minmax(0,1fr))}.linkrow{flex-direction:column}.output{padding:16px}}
.qr-panel{text-align:center;margin:18px 0 6px;padding:18px 0 8px;border-top:1px solid var(--line)}.qr-panel[hidden]{display:none}.qr-panel h2{font-size:20px;margin:0 0 6px}.qr-frame{display:inline-block;background:#fff;padding:20px;margin:10px auto;border:1px solid var(--line);border-radius:12px}.qr-frame img,.qr-frame canvas{width:256px!important;height:256px!important;display:block;image-rendering:pixelated}.qr-panel p{margin:0;font-size:15px}@media(max-width:360px){.qr-frame img,.qr-frame canvas{width:224px!important;height:224px!important}.qr-frame{padding:12px}}
</style></head><body><main>
<h1>국가별 손님 안내 링크</h1>
<p class="intro">손님 국적을 누르면 안내 링크가 복사되고 QR이 나타납니다. 링크를 보내거나 손님에게 QR을 보여 주세요.</p>
<div class="output"><label for="result" id="selected">국가를 선택해 주세요</label><div class="linkrow"><input id="result" readonly aria-label="국가별 안내 URL" placeholder="아래 국가를 누르면 링크가 나타납니다"><button class="copy" id="copy" type="button">링크 복사</button></div><div id="feedback" role="status" aria-live="polite"></div><div class="qr-panel" id="qrPanel" hidden><h2 id="qrLabel"></h2><p>Scan to explore Yongho-dong</p><div class="qr-frame"><div id="qr" role="img" aria-label="손님용 안내 링크 QR 코드"></div></div><p class="help">손님 카메라로 이 QR을 찍어 주세요.</p></div><p class="help">손님이 이 링크로 방문하면 활동 기록에 국가 꼬리표가 함께 남습니다. 국적은 대표님이 선택한 값으로 기록됩니다.</p></div>
<div class="groups" id="groups"></div>
<form class="custom" id="custom"><h2>목록에 없는 국가</h2><label for="country">국가 이름</label><div class="linkrow"><input id="country" maxlength="60" required placeholder="예: 오스트리아 / Austria" autocomplete="off"><button type="submit">링크 만들고 복사</button></div><p class="help">목록에 있는 국가는 위 버튼을 사용해 주세요. 직접 입력한 국가는 입력한 이름으로 구분됩니다.</p></form>
<p class="help" style="margin-top:28px"><a href="../" target="_blank" rel="noopener">손님용 가이드 열기 ↗</a></p>
</main><script src="vendor/qrcode.min.js"></script><script>
const groups=[
['아시아', [['TW','대만','Taiwan'],['HK','홍콩','Hong Kong'],['SG','싱가포르','Singapore'],['JP','일본','Japan'],['MY','말레이시아','Malaysia'],['TH','태국','Thailand'],['PH','필리핀','Philippines'],['ID','인도네시아','Indonesia'],['VN','베트남','Vietnam'],['CN','중국','China'],['IN','인도','India'],['KR','대한민국','South Korea']]],
['북미 · 오세아니아', [['US','미국','United States'],['CA','캐나다','Canada'],['AU','호주','Australia'],['NZ','뉴질랜드','New Zealand']]],
['유럽', [['GB','영국','United Kingdom'],['DE','독일','Germany'],['FR','프랑스','France'],['NL','네덜란드','Netherlands'],['IT','이탈리아','Italy'],['ES','스페인','Spain'],['CH','스위스','Switzerland'],['BE','벨기에','Belgium'],['NO','노르웨이','Norway'],['SE','스웨덴','Sweden'],['DK','덴마크','Denmark'],['FI','핀란드','Finland']]]];
const result=document.getElementById('result'), feedback=document.getElementById('feedback');
let qr;function showQR(url,label){const panel=document.getElementById('qrPanel');panel.hidden=false;document.getElementById('qrLabel').textContent=label+' 손님용 QR';if(qr){qr.clear();qr.makeCode(url)}else{qr=new QRCode(document.getElementById('qr'),{text:url,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}}
function makeLink(code){const url=new URL('../',location.href);url.search='';url.hash='';url.searchParams.set('src','country_link');url.searchParams.set('c',code);return url.href}
async function copyLink(){if(!result.value){feedback.textContent='먼저 국가를 선택해 주세요.';return}const value=result.value;let copied=false;try{await navigator.clipboard.writeText(value);copied=true}catch(e){result.focus();result.select();try{copied=document.execCommand('copy')}catch(e){}}if(result.value===value)feedback.textContent=copied?'링크를 복사했습니다. 손님에게 붙여넣어 보내 주세요.':'자동 복사가 안 되면 위 링크를 길게 눌러 복사해 주세요.'}
function choose(code,label,button){document.querySelectorAll('.country').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('selected').textContent=label+' 손님용 링크';result.value=makeLink(code);feedback.textContent='';showQR(result.value,label);copyLink();document.querySelector('.output').scrollIntoView({block:'start',behavior:'instant'})}
groups.forEach(([name,countries])=>{const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=name;grid.className='countries';countries.forEach(([code,ko,en])=>{const b=document.createElement('button');b.type='button';b.className='country';b.setAttribute('aria-pressed','false');b.append(document.createTextNode(ko));const small=document.createElement('small');small.textContent=en;b.append(small);b.addEventListener('click',()=>choose(code,ko,b));grid.append(b)});section.append(h,grid);document.getElementById('groups').append(section)});
document.getElementById('copy').addEventListener('click',copyLink);
document.getElementById('custom').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('country'),name=input.value.normalize('NFKC').trim().replace(/\s+/g,' ');if(!name){feedback.textContent='국가 이름을 입력해 주세요.';input.focus();return}const match=groups.flatMap(g=>g[1]).find(c=>c.some(v=>v.toLowerCase()===name.toLowerCase()));choose(match?match[0]:'custom:'+name.toLowerCase(),match?match[1]:name,null)});
</script></body></html>
